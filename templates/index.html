<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HookLens // Python Webhook Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-neutral-950 text-neutral-100 font-mono min-h-screen flex flex-col"
  >
    <header
      class="border-b border-neutral-800 bg-neutral-900/90 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/40 text-amber-400 flex items-center justify-center font-bold text-xs"
        >
          HL
        </div>
        <div>
          <h1
            class="text-xs font-bold uppercase tracking-wider text-neutral-100"
          >
            HookLens // Webhook Traffic Inspector
          </h1>
          <p class="text-[10px] text-neutral-400">
            LISTEN ENDPOINT:
            <span class="text-amber-400"
              >POST http://localhost:8080/webhook/&lt;any-route&gt;</span
            >
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          onclick="simulateWebhook()"
          class="bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold text-xs px-4 py-2 rounded-lg transition-colors"
        >
          + Simulate Incoming Webhook
        </button>
        <button
          onclick="clearEvents()"
          class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 text-xs px-3 py-2 rounded-lg transition-colors"
        >
          Clear Log
        </button>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6 flex flex-col">
      <!-- Telemetry Strip -->
      <section
        id="stats-bar"
        class="grid grid-cols-2 md:grid-cols-4 gap-4"
      ></section>

      <!-- Search & Filter Bar -->
      <div class="flex flex-col sm:flex-row gap-3">
        <input
          id="search-input"
          oninput="loadDashboard()"
          placeholder="Filter by route, IP, or payload key..."
          class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2 text-xs text-neutral-200 focus:outline-none focus:border-amber-500"
        />
        <select
          id="method-filter"
          onchange="loadDashboard()"
          class="bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2 text-xs text-neutral-200 focus:outline-none"
        >
          <option value="ALL">All HTTP Methods</option>
          <option value="POST">POST Only</option>
          <option value="PUT">PUT Only</option>
          <option value="PATCH">PATCH Only</option>
        </select>
      </div>

      <!-- Split-Pane Inspector -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
        <!-- Left Pane: Captured Stream -->
        <div
          class="lg:col-span-5 bg-neutral-900/60 border border-neutral-800 rounded-2xl p-4 space-y-2 max-h-[600px] overflow-y-auto"
        >
          <h2
            class="text-[11px] font-bold uppercase tracking-wider text-neutral-400 px-1 pb-1"
          >
            Captured Requests
          </h2>
          <div id="event-list" class="space-y-2"></div>
        </div>

        <!-- Right Pane: Payload & Headers Inspector -->
        <div
          id="inspector-pane"
          class="lg:col-span-7 bg-neutral-900/60 border border-neutral-800 rounded-2xl p-6 space-y-5"
        >
          <div class="text-center py-20 text-xs text-neutral-500">
            Select a captured webhook on the left to inspect headers and
            payload.
          </div>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
